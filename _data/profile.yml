short_bio: >-
  <p>
    I am a Ph.D. student in Computer & Information Science at <a href="https://www.temple.edu/" target="_blank">Temple University</a>, advised by <a href="https://hcgao.github.io/index.html" target="_blank">Dr. Hongchang Gao</a> and also working closely with <a href="https://cis.temple.edu/~souvenir/" target="_blank">Dr. Richard Souvenir</a>. 
    My research focuses on designing large-scale optimization algorithms, including:</p>
    <ul>
      <li>Compositional optimization for AUC maximization</li>
      <li>Optimization beyond minimization (e.g., minimax, bilevel, multi-level, etc)</li>
      <li>Optimization for large language models (pre-training and post-training)</li>
    </ul>

